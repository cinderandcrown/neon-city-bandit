name: CI

on:
  pull_request:
  push:
    branches: [main, "mission/**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Spriterrific credit spend is DISABLED in CI.
  # Fire Fox runs anchor/animate locally and hands sheets to the agent.
  # Do not re-add an auto-spend job or Assets/SPRITERRIFIC_REQUEST.

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -v
      - name: App icon is Nicholas official portrait
        run: python3 scripts/check_app_icon_md5.py

  gamecore-linux:
    name: GameCore (Linux)
    # Pin 24.04: Swift 6.2 official tarball targets ubuntu2404; ubuntu-latest is 26.04
    # and lacks libxml2.so.2 SONAME expected by that toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Swift 6.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2 libncurses6 libcurl4 binutils
          curl -fsSL "https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz" -o /tmp/swift.tgz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tgz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
          arch="$(uname -m)"
          if [ ! -e "/usr/lib/${arch}-linux-gnu/libncurses.so.6" ] && [ -e "/usr/lib/${arch}-linux-gnu/libncursesw.so.6" ]; then
            sudo ln -sf libncursesw.so.6 "/usr/lib/${arch}-linux-gnu/libncurses.so.6"
          fi
      - name: swift --version
        run: swift --version
      - name: GameCore tests
        working-directory: Packages/GameCore
        run: swift test
      - name: Level reachability validator
        run: ./scripts/validate_level_reachability.sh
      - name: Services tests
        working-directory: Packages/Services
        run: swift test
      - name: GameRender tests (Linux-safe symbols)
        working-directory: Packages/GameRender
        run: swift test

  build:
    name: Build and test (iPhone)
    runs-on: xcode-27
    # Smoke (~45m) + SE layout create/boot (~10m) needs headroom past the old 60m cap.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          echo "Runner labels context: xcode-27 (standard; not xlarge)"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "ImageOS=${ImageOS:-unknown} RUNNER_NAME=${RUNNER_NAME:-unknown}"

      - name: Install XcodeGen + ffmpeg
        run: brew install xcodegen ffmpeg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Magpie.xcodeproj \
            -scheme Magpie \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
          | tee xcodebuild.log \
          | xcbeautify --renderer github-actions

      - name: Fail on app-target warnings/errors
        if: always()
        run: |
          [ -f xcodebuild.log ] || exit 0
          root="$PWD/"
          errs=$(grep -E "^${root}(Magpie|MagpieTests|Packages)/[^:]+:[0-9]+:[0-9]+: error:" xcodebuild.log | awk '!seen[$0]++' || true)
          warns=$(grep -E "^${root}(Magpie|MagpieTests|Packages)/[^:]+:[0-9]+:[0-9]+: warning:" xcodebuild.log | awk '!seen[$0]++' || true)
          echo "Errors:"; echo "$errs"
          echo "Warnings:"; echo "$warns"
          if [ -n "$errs" ] || [ -n "$warns" ]; then exit 1; fi

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          device="$(python3 scripts/pick_iphone_simulator.py)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          echo "Simulator: $device"

          run_tests() {
            # Capture stderr too — launch flakes often only appear there, not in tee'd stdout.
            xcodebuild test-without-building \
              -project Magpie.xcodeproj \
              -scheme Magpie \
              -destination "platform=iOS Simulator,id=$device" \
              -derivedDataPath DerivedData \
              -resultBundlePath TestResults.xcresult \
              -parallel-testing-enabled NO \
              2>&1 \
            | tee xcodebuild-test.log \
            | xcbeautify --renderer github-actions
          }

          # Auto-retry once on simulator boot/launch flakes (XPC / test-host).
          if ! run_tests; then
            # Retry only on simulator launch/XPC flakes — never on generic "TEST EXECUTE FAILED"
            # (that string appears for real assertion failures too).
            if grep -qiE 'Unable to boot the Simulator|XPC error|failed to launch|Launch failed|Connection interrupted|SimLaunchHostService|bootstrapping|Lost pending connection|No such process|Early unexpected exit|did not return a process handle|Failed to establish communication with the test runner|Channel disconnected|Lost connection to the test runner|The test runner failed to initialize|Test runner never began' xcodebuild-test.log; then
              echo "WARN: simulator boot/launch flake — retrying unit tests once" >&2
              xcrun simctl shutdown "$device" 2>/dev/null || true
              sleep 2
              xcrun simctl boot "$device" 2>/dev/null || true
              xcrun simctl bootstatus "$device" -b || true
              rm -rf TestResults.xcresult
              run_tests
            else
              exit 1
            fi
          fi

      - name: Simulator smoke (gameplay video + moment screenshots)
        env:
          DEVICE: ${{ steps.tests.outputs.device }}
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products -name 'Magpie.app' -type d | head -1)"
          test -n "$app"
          device="$DEVICE"
          # Auto-retry once on simulator boot/launch flakes (XPC / test-host).
          if ! ./scripts/simulator_smoke.sh "$device" "$app" smoke-artifacts; then
            if [[ -f smoke-artifacts/smoke_status.txt ]] || ls smoke-artifacts/*.png >/dev/null 2>&1; then
              # Smoke ran far enough to write artifacts — real gate failure, do not retry.
              exit 1
            fi
            echo "WARN: simulator smoke failed before artifacts — retrying once (boot/launch flake?)" >&2
            xcrun simctl shutdown "$device" 2>/dev/null || true
            sleep 2
            xcrun simctl boot "$device" 2>/dev/null || true
            xcrun simctl bootstatus "$device" -b || true
            rm -rf smoke-artifacts
            ./scripts/simulator_smoke.sh "$device" "$app" smoke-artifacts
          fi

      - name: Layout shots (16 Pro + SE)
        if: success()
        env:
          DEVICE: ${{ steps.tests.outputs.device }}
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products -name 'Magpie.app' -type d | head -1)"
          test -n "$app"
          chmod +x scripts/simulator_layout_shots.sh
          # DEVICE is the smoke Pro-class udid — layout script also creates SE (3rd gen).
          ./scripts/simulator_layout_shots.sh "$app" smoke-artifacts
          test -s smoke-artifacts/layout-16pro-play.png
          test -s smoke-artifacts/layout-se-play.png
          python3 - <<'PY'
          import struct, zlib
          def png_size(path):
              with open(path, "rb") as f:
                  sig = f.read(8)
                  assert sig.startswith(b"\x89PNG"), path
                  length = int.from_bytes(f.read(4), "big")
                  ctype = f.read(4)
                  assert ctype == b"IHDR", path
                  data = f.read(length)
                  w, h = struct.unpack(">II", data[:8])
                  return w, h
          pro = png_size("smoke-artifacts/layout-16pro-play.png")
          se = png_size("smoke-artifacts/layout-se-play.png")
          print(f"layout-16pro-play {pro[0]}x{pro[1]}")
          print(f"layout-se-play {se[0]}x{se[1]}")
          if se == pro:
              raise SystemExit("FAIL: SE and Pro layout stills have identical pixel size")
          # SE 3rd gen is 750×1334 (or 1500×2668 @2x) — ~16:9. Pro is taller (~19.5:9).
          se_ar = se[1] / se[0]
          expect = 1334 / 750
          if abs(se_ar - expect) > 0.08:
              raise SystemExit(f"FAIL: SE aspect {se_ar:.3f} not SE-class (want ~{expect:.3f})")
          if se[0] not in (750, 1500) and not (700 <= se[0] <= 1600 and abs(se_ar - expect) < 0.05):
              raise SystemExit(f"FAIL: unexpected SE size {se[0]}x{se[1]}")
          # Require the shutter-time smoke status (titleHidden=1 + playing).
          from pathlib import Path
          st = Path("smoke-artifacts/layout-se-play-status.txt")
          if not st.is_file():
              raise SystemExit("FAIL: missing layout-se-play-status.txt")
          line = st.read_text()
          print("layout-se-play-status:", line.strip()[:220])
          if "phase=playing" not in line or "titleHidden=1" not in line:
              raise SystemExit(f"FAIL: SE play still not live gameplay ({line[:160]!r})")
          if "elapsed=" in line:
              import re
              m = re.search(r"elapsed=([0-9.]+)", line)
              if not m or float(m.group(1)) < 2.5:
                  raise SystemExit(f"FAIL: SE play elapsed too low ({line[:160]!r})")
          PY

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            xcodebuild-test.log
            TestResults.xcresult
          if-no-files-found: ignore
